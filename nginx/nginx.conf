server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    # The 3D world (/3d/) is our own page and the only thing the app frames, so
    # it may be framed by the same origin; everything else stays DENY. An
    # add_header inside a location replaces the server-level ones, which is why
    # the security headers are repeated here and in the nested location.
    location ^~ /3d/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # The page itself is revalidated every time; its hashed scripts under
        # /assets/ are immutable (location below).
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;

        # Textures, postcards and fonts keep stable names, so a month rather
        # than "immutable": a replaced texture shows up within 30 days.
        location ~* \.(?:webp|woff2)$ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }
    }

    location ^~ /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
   }

    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1M;
        access_log off;
    }

}