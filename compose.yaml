services:
  nginx:
    container_name: rumbos-frontend
    env_file:
      - .env
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET}
        VITE_ACTIVITY_OPEN_MODE: ${VITE_ACTIVITY_OPEN_MODE}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API}
        VITE_SHOW_BUNDLED_BACKGROUNDS: ${VITE_SHOW_BUNDLED_BACKGROUNDS}
        RUMBOS_BUILD_COMMIT: ${RUMBOS_BUILD_COMMIT:-unknown}
    expose:
      - 8080
    networks:
      - rumbos-network


networks:
  rumbos-network:
    driver: bridge
    external: true